name: Documentation and Pages

on:
  push:
    branches: [main-v1]
    paths:
      - 'docs/site/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/pages.yml'
      - 'tools/check_source.py'
      - 'tools/export_source.py'
      - 'tools/public_source.json'
      - 'tests/test_workflows.py'
  pull_request:
    branches: [main-v1]
    paths:
      - 'docs/site/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/pages.yml'
      - 'tools/check_source.py'
      - 'tools/export_source.py'
      - 'tools/public_source.json'
      - 'tests/test_workflows.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Check public source
        run: python tools/check_source.py --tracked
      - name: Test v1 workflow branch boundaries
        run: python -m unittest discover -s tests -p test_workflows.py
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Build documentation
        run: python -m mkdocs build --strict --site-dir "$RUNNER_TEMP/komamimic-site"
