name: Rocky 8 build probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rocky8-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rocky8:
    name: Rocky 8.10 x64 / Raven / full tests
    runs-on: ubuntu-24.04
    container: rockylinux/rockylinux:8.10
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PROBE_DIR: ${{ github.workspace }}/tmp/rocky8-probe
      QT_QPA_PLATFORM: offscreen
      # Only test processes in this root-owned CI container disable the sandbox.
      QTWEBENGINE_DISABLE_SANDBOX: '1'
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      PYTHONDONTWRITEBYTECODE: '1'
      LIBARCHIVE_VERSION: '3.8.10'
      LIBARCHIVE_SHA256: a1bffbe5152cfe869751179e7b16648c87c461cb8c46eee75062efbe164cc57c
    steps:
      - name: Bootstrap container
        timeout-minutes: 10
        run: |
          exec > >(tee /var/log/komamimic-bootstrap.log) 2>&1
          # Avoid long waits while cycling through geographically selected
          # Rocky mirrors. Preserve the RPM signature settings from the image.
          /usr/libexec/platform-python - <<'PY'
          import configparser
          from pathlib import Path

          trees = {'baseos': 'BaseOS', 'appstream': 'AppStream',
                   'extras': 'extras', 'powertools': 'PowerTools'}
          for path in Path('/etc/yum.repos.d').glob('Rocky-*.repo'):
              config = configparser.ConfigParser(interpolation=None)
              config.read(str(path))
              changed = False
              for section in config.sections():
                  if section not in trees:
                      continue
                  for key in ('mirrorlist', 'metalink'):
                      config[section].pop(key, None)
                  url = ('https://dl.rockylinux.org/pub/rocky/$releasever/'
                         + trees[section] + '/$basearch/os/')
                  config[section]['baseurl'] = url
                  print(section + ': ' + url, flush=True)
                  changed = True
              if changed:
                  with path.open('w') as stream:
                      config.write(stream)
          config = configparser.ConfigParser(interpolation=None)
          config.read('/etc/dnf/dnf.conf')
          config['main']['timeout'] = '20'
          config['main']['minrate'] = '1024'
          config['main']['retries'] = '2'
          with open('/etc/dnf/dnf.conf', 'w') as stream:
              config.write(stream)
          PY
          dnf -v install -y git ca-certificates
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install Rocky and Raven dependencies
        run: |
          mkdir -p "$PROBE_DIR/temp" "$PROBE_DIR/cache"
          exec > >(tee "$PROBE_DIR/dependencies.log") 2>&1
          dnf install -y dnf-plugins-core epel-release python3.11
          dnf config-manager --set-enabled powertools
          # Match Poppler's TIFF ABI before enabling third-party repositories.
          dnf install -y libtiff-devel
          dnf install -y https://pkgs.sysadmins.ws/el8/base/x86_64/raven-release.el8.noarch.rpm

          # Reuse the release RPM's signing configuration. WebEngine's codec
          # dependencies also require multimedia; keep testing disabled.
          /usr/libexec/platform-python - <<'PY'
          import configparser
          from pathlib import Path

          repos = configparser.ConfigParser(interpolation=None)
          repos.read([str(p) for p in Path('/etc/yum.repos.d').glob('*.repo')])
          if 'raven' not in repos:
              raise SystemExit('The Raven release RPM did not define the raven repository')
          template = dict(repos['raven'])
          for path in Path('/etc/yum.repos.d').glob('*.repo'):
              config = configparser.ConfigParser(interpolation=None)
              config.read(str(path))
              changed = False
              for section in config.sections():
                  if section.startswith('raven'):
                      config[section]['enabled'] = '0'
                      changed = True
              if changed:
                  with path.open('w') as stream:
                      config.write(stream)
          probe = configparser.ConfigParser(interpolation=None)
          for tree in ('base', 'extras', 'rx-devel', 'multimedia'):
              settings = dict(template)
              for key in ('mirrorlist', 'metalink'):
                  settings.pop(key, None)
              settings.update(name='Raven EL8 probe ' + tree,
                              baseurl='https://pkgs.sysadmins.ws/el8/' + tree + '/x86_64/',
                              enabled='1', skip_if_unavailable='0')
              probe['komamimic-raven-' + tree] = settings
          with open('/etc/yum.repos.d/komamimic-raven-probe.repo', 'w') as stream:
              probe.write(stream)
          PY

          dnf repolist -v
          dnf install -y gcc-toolset-12-gcc-c++ gcc-toolset-12-gdb cmake ninja-build pkgconf-pkg-config \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qttools-devel qt6-linguist \
            qt6-qttranslations qt6-qtwebengine-devel qt6-qtimageformats \
            libicu78-devel zlib-devel SDL2-devel curl tar 'libjpeg.so.62()(64bit)' \
            bzip2-devel xz-devel libzstd-devel lz4-devel openssl-devel libxml2-devel \
            rx-poppler-glib-devel rx-glib2-devel rx-cairo rx-cairo-devel dbus-daemon
      - name: Record dependencies and configure search paths
        run: |
          exec > >(tee "$PROBE_DIR/environment.log") 2>&1
          cat /etc/os-release
          getconf GNU_LIBC_VERSION
          rpm -qa --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\n' | sort > "$PROBE_DIR/packages.txt"
          cp /etc/yum.repos.d/komamimic-raven-probe.repo "$PROBE_DIR/"

          # RX packages may use a separate prefix. Discover installed paths
          # rather than assuming /usr or replacing the system libraries.
          python3.11 - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          installed = subprocess.check_output(
              ['rpm', '-ql', 'rx-poppler-glib-devel', 'rx-glib2-devel', 'rx-cairo-devel', 'libicu78-devel'],
              text=True).splitlines()
          pc_dirs = sorted({str(Path(p).parent) for p in installed
                            if p.endswith('.pc')})
          if not pc_dirs:
              raise SystemExit('No pkg-config directories found in the RX development RPMs')
          print('RX pkg-config directories: ' + ':'.join(pc_dirs))
          qt = subprocess.check_output(['rpm', '-ql', 'qt6-qtbase-devel'], text=True).splitlines()
          configs = [str(Path(p).parent) for p in qt if p.endswith('/Qt6Config.cmake')]
          if len(configs) != 1:
              raise SystemExit('Expected one Qt6Config.cmake: ' + repr(configs))
          cairo_files = subprocess.check_output(
              ['rpm', '-ql', 'rx-cairo', 'rx-cairo-devel'], text=True).splitlines()
          cairo_paths = sorted({Path(p) for p in cairo_files
                                if Path(p).name == 'libcairo.so' or Path(p).name.startswith('libcairo.so.')})
          for path in cairo_paths:
              target = os.readlink(path) if path.is_symlink() else '(not a symlink)'
              print(str(path) + ' -> ' + target + '; usable=' + str(path.is_file()))
          # A broken devel symlink must not hide an intact versioned runtime
          # library. Select only real files owned by the installed RX RPMs.
          cairo_libraries = sorted({p.resolve(strict=True) for p in cairo_paths if p.is_file()})
          if len(cairo_libraries) != 1:
              raise SystemExit('Expected one RX Cairo runtime library: ' + repr(cairo_libraries))
          cairo_library = cairo_libraries[0]
          print('RX Cairo link library: ' + str(cairo_library))
          jpeg_packages = subprocess.check_output(
              ['rpm', '-q', '--whatprovides', 'libjpeg.so.62()(64bit)', '--qf', '%{NAME}\n'],
              text=True).splitlines()
          jpeg_files = subprocess.check_output(['rpm', '-ql', *sorted(set(jpeg_packages))], text=True).splitlines()
          jpeg_libraries = sorted({Path(p).resolve(strict=True) for p in jpeg_files
                                   if (Path(p).name == 'libjpeg.so.62' or Path(p).name.startswith('libjpeg.so.62.'))
                                   and Path(p).is_file()})
          if not jpeg_libraries:
              raise SystemExit('No usable JPEG ABI 62 library in: ' + repr(jpeg_files))
          # Prefer the RX provider when both the system and RX provide ABI 62.
          jpeg_library = next((p for p in jpeg_libraries if str(p).startswith('/opt/rx/')), jpeg_libraries[0])
          print('JPEG ABI 62 runtime library: ' + str(jpeg_library))
          icu_files = subprocess.check_output(['rpm', '-ql', 'libicu78', 'libicu78-devel'], text=True).splitlines()
          icu_headers = sorted({str(Path(p).parent.parent) for p in icu_files if p.endswith('/unicode/uversion.h')})
          icu_libraries = sorted({Path(p).resolve(strict=True) for p in icu_files
                                  if (Path(p).name == 'libicuuc.so.78' or Path(p).name.startswith('libicuuc.so.78.'))
                                  and Path(p).is_file()})
          if len(icu_headers) != 1 or len(icu_libraries) != 1:
              raise SystemExit('Expected one ICU 78 header/library: ' + repr((icu_headers, icu_libraries)))
          print('ICU 78 header/library: ' + repr((icu_headers, icu_libraries)))
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('PKG_CONFIG_PATH=' + ':'.join(pc_dirs) + '\n')
              stream.write('KOMA_PROBE_QT_DIR=' + configs[0] + '\n')
              stream.write('KOMA_PROBE_CAIRO_LIBRARY=' + str(cairo_library) + '\n')
              stream.write('KOMA_PROBE_CAIRO_LIBDIR=' + str(cairo_library.parent) + '\n')
              stream.write('KOMA_PROBE_JPEG_LIBDIR=' + str(jpeg_library.parent) + '\n')
              stream.write('KOMA_PROBE_ICU_INCLUDE_DIR=' + icu_headers[0] + '\n')
              stream.write('KOMA_PROBE_ICU_LIBRARY=' + str(icu_libraries[0]) + '\n')
              stream.write('KOMA_PROBE_ICU_LIBDIR=' + str(icu_libraries[0].parent) + '\n')
          PY
          # GCC Toolset's enable script also sets its runtime library path.
          set +u
          source /opt/rh/gcc-toolset-12/enable
          set -u
          printf '%s\n' "$PATH" >> "$GITHUB_PATH"
          printf 'LD_LIBRARY_PATH=%s\n' "${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          g++ --version
          cmake --version
          python3.11 --version
      - name: Checkout Qt TIFF plugin source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: qt/qtimageformats
          ref: v6.11.2
          path: tmp/qtimageformats-source
          persist-credentials: false
      - name: Rebuild Qt TIFF plugin against the Poppler TIFF ABI
        run: |
          exec > >(tee "$PROBE_DIR/qtiff-build.log") 2>&1
          export TMPDIR="$PROBE_DIR/temp" XDG_CACHE_HOME="$PROBE_DIR/cache"
          export LD_LIBRARY_PATH="$KOMA_PROBE_JPEG_LIBDIR:$KOMA_PROBE_ICU_LIBDIR:$KOMA_PROBE_CAIRO_LIBDIR:${LD_LIBRARY_PATH:-}"
          git -C tmp/qtimageformats-source rev-parse HEAD > "$PROBE_DIR/qtimageformats-commit.txt"
          git -C tmp/qtimageformats-source archive --format=tar --prefix=qtimageformats/ HEAD \
            | gzip -n > "$PROBE_DIR/qtimageformats-source.tar.gz"
          sha256sum "$PROBE_DIR/qtimageformats-source.tar.gz" > "$PROBE_DIR/qtimageformats-SHA256SUMS.txt"
          python3.11 - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          probe = Path(os.environ['PROBE_DIR'])
          source = Path('tmp/qtimageformats-source/src/plugins/imageformats/tiff').resolve()
          headers = subprocess.check_output(['rpm', '-ql', 'libtiff-devel'], text=True).splitlines()
          include_dirs = sorted({str(Path(p).parent) for p in headers if p.endswith('/tiffio.h')})
          runtime = subprocess.check_output(['rpm', '-ql', 'libtiff'], text=True).splitlines()
          libraries = sorted({Path(p).resolve(strict=True) for p in runtime
                              if Path(p).name.startswith('libtiff.so.5') and Path(p).is_file()})
          plugins = subprocess.check_output(['rpm', '-ql', 'qt6-qtimageformats'], text=True).splitlines()
          plugins = [Path(p) for p in plugins if p.endswith('/imageformats/libqtiff.so') and Path(p).is_file()]
          if len(include_dirs) != 1 or len(libraries) != 1 or len(plugins) != 1:
              raise SystemExit('Ambiguous TIFF 5 header/library/plugin: ' + repr((include_dirs, libraries, plugins)))
          project = probe / 'qtiff-project'
          project.mkdir()
          cmake = '''cmake_minimum_required(VERSION 3.22)
          project(RockyQTiff LANGUAGES CXX)
          set(CMAKE_AUTOMOC ON)
          set(CMAKE_CXX_STANDARD 17)
          find_package(Qt6 6.11.2 EXACT REQUIRED COMPONENTS Core Gui)
          find_package(TIFF REQUIRED)
          qt_add_plugin(QTiffPlugin SHARED CLASS_NAME QTiffPlugin)
          set_target_properties(QTiffPlugin PROPERTIES OUTPUT_NAME qtiff)
          target_sources(QTiffPlugin PRIVATE "${QT_TIFF_SOURCE}/main.cpp"
              "${QT_TIFF_SOURCE}/qtiffhandler.cpp" "${QT_TIFF_SOURCE}/qtiffhandler_p.h")
          target_link_libraries(QTiffPlugin PRIVATE Qt6::Gui TIFF::TIFF)
          '''
          (project / 'CMakeLists.txt').write_text(cmake)
          subprocess.run(['cmake', '-S', str(project), '-B', str(probe / 'qtiff-build'), '-G', 'Ninja',
                          '-DCMAKE_BUILD_TYPE=Release', '-DQt6_DIR=' + os.environ['KOMA_PROBE_QT_DIR'],
                          '-DQT_TIFF_SOURCE=' + str(source), '-DTIFF_INCLUDE_DIR=' + include_dirs[0],
                          '-DTIFF_LIBRARY=' + str(libraries[0]), '-DTIFF_LIBRARY_RELEASE=' + str(libraries[0])], check=True)
          subprocess.run(['cmake', '--build', str(probe / 'qtiff-build'), '--parallel', '4'], check=True)
          built = list((probe / 'qtiff-build').rglob('libqtiff.so'))
          if len(built) != 1:
              raise SystemExit('Expected one rebuilt TIFF plugin: ' + repr(built))
          needed = subprocess.check_output(['readelf', '-d', str(built[0])], text=True)
          print(needed)
          if '[libtiff.so.5]' not in needed or '[libtiff.so.6]' in needed:
              raise SystemExit('Rebuilt Qt plugin must depend on TIFF ABI 5 only')
          import shutil
          shutil.copy2(plugins[0], probe / 'vendor-libqtiff.so')
          shutil.copy2(built[0], plugins[0])
          subprocess.run(['ldd', str(plugins[0])], check=True)
          PY
      - name: Build libarchive with RAR5 support
        run: |
          exec > >(tee "$PROBE_DIR/libarchive-build.log") 2>&1
          export TMPDIR="$PROBE_DIR/temp" XDG_CACHE_HOME="$PROBE_DIR/cache"
          source_archive="$PROBE_DIR/libarchive-$LIBARCHIVE_VERSION.tar.gz"
          curl --fail --location --retry 3 --connect-timeout 20 \
            --output "$source_archive" \
            "https://github.com/libarchive/libarchive/releases/download/v$LIBARCHIVE_VERSION/libarchive-$LIBARCHIVE_VERSION.tar.gz"
          printf '%s  %s\n' "$LIBARCHIVE_SHA256" "$source_archive" > "$PROBE_DIR/libarchive-SHA256SUMS.txt"
          sha256sum --check "$PROBE_DIR/libarchive-SHA256SUMS.txt"
          tar -xzf "$source_archive" -C "$PROBE_DIR"
          prefix="$PROBE_DIR/libarchive-prefix"
          cmake -S "$PROBE_DIR/libarchive-$LIBARCHIVE_VERSION" \
            -B "$PROBE_DIR/libarchive-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DCMAKE_INSTALL_LIBDIR=lib -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=OFF -DENABLE_TEST=OFF \
            -DENABLE_TAR=OFF -DENABLE_CPIO=OFF -DENABLE_CAT=OFF -DENABLE_UNZIP=OFF
          cmake --build "$PROBE_DIR/libarchive-build" --parallel 4
          cmake --install "$PROBE_DIR/libarchive-build"
          cp "$PROBE_DIR/libarchive-$LIBARCHIVE_VERSION/COPYING" "$PROBE_DIR/libarchive-COPYING.txt"
          # Verify both the header and the linked library before building KomaMimic.
          cat > "$PROBE_DIR/libarchive-rar5-check.c" <<'C'
          #include <archive.h>
          #include <stdio.h>
          int main(void) {
              struct archive *reader = archive_read_new();
              if (!reader) return 1;
              printf("%s\n", archive_version_string());
              int status = archive_read_support_format_rar5(reader);
              archive_read_free(reader);
              return status == ARCHIVE_OK ? 0 : 1;
          }
          C
          cc -I"$prefix/include" "$PROBE_DIR/libarchive-rar5-check.c" \
            "$prefix/lib/libarchive.so" -Wl,-rpath,"$prefix/lib" \
            -o "$PROBE_DIR/libarchive-rar5-check"
          LD_LIBRARY_PATH="$prefix/lib:${LD_LIBRARY_PATH:-}" "$PROBE_DIR/libarchive-rar5-check"
          printf 'LD_LIBRARY_PATH=%s/lib:%s\n' "$prefix" "${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - name: Configure Release and full tests
        run: |
          exec > >(tee "$PROBE_DIR/configure.log") 2>&1
          export TMPDIR="$PROBE_DIR/temp" XDG_CACHE_HOME="$PROBE_DIR/cache"
          pkg-config --modversion poppler-glib glib-2.0 gobject-2.0 cairo
          pkg-config --print-errors --exists 'poppler-glib >= 22.0' \
            'glib-2.0 >= 2.64' 'gobject-2.0 >= 2.64' 'cairo >= 1.16.0'
          for module in poppler-glib glib-2.0 gobject-2.0 cairo; do
            printf '%s pkg-config directory: ' "$module"
            pkg-config --variable=pcfiledir "$module"
          done
          rx_libs=$KOMA_PROBE_JPEG_LIBDIR:$KOMA_PROBE_ICU_LIBDIR:$KOMA_PROBE_CAIRO_LIBDIR:$(pkg-config --variable=libdir poppler-glib):$(pkg-config --variable=libdir glib-2.0):$(pkg-config --variable=libdir cairo)
          printf 'RX link search directories: %s\n' "$rx_libs"
          pkg-config --libs poppler-glib cairo
          export LD_LIBRARY_PATH="$PROBE_DIR/libarchive-prefix/lib:$rx_libs:${LD_LIBRARY_PATH:-}"
          printf 'LD_LIBRARY_PATH=%s\n' "$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          python3.11 - <<'PY'
          import ctypes
          import os

          cairo = ctypes.CDLL(os.environ['KOMA_PROBE_CAIRO_LIBRARY'])
          cairo.cairo_version.restype = ctypes.c_int
          cairo.cairo_version_string.restype = ctypes.c_char_p
          print('Loaded RX Cairo: ' + cairo.cairo_version_string().decode('ascii'))
          if cairo.cairo_version() < 11600:
              raise SystemExit('RX Cairo runtime must be at least 1.16.0')
          # Inspect the dependency closure before the lengthy application build.
          import subprocess
          from pathlib import Path

          libraries = [os.environ['KOMA_PROBE_CAIRO_LIBRARY'], os.environ['KOMA_PROBE_ICU_LIBRARY']]
          for package in ('qt6-qtbase', 'qt6-qtbase-gui', 'qt6-qtwebengine', 'rx-poppler-glib'):
              files = subprocess.check_output(['rpm', '-ql', package], text=True).splitlines()
              libraries.extend(p for p in files if Path(p).name in
                               ('libQt6Core.so.6', 'libQt6Gui.so.6', 'libQt6WebEngineCore.so.6', 'libpoppler-glib.so.8')
                               and Path(p).is_file())
          missing = []
          for library in libraries:
              result = subprocess.run(['ldd', library], text=True, capture_output=True)
              print('Dependencies of ' + library + ':\n' + result.stdout + result.stderr)
              if result.returncode or 'not found' in result.stdout:
                  missing.append(library)
          if missing:
              raise SystemExit('Unresolved runtime dependencies: ' + repr(missing))
          PY
          # FindPkgConfig's POPPLER imported target uses this cache entry for
          # -lcairo. Pin it to the actual RX file, not only cairo.pc's libdir.
          cmake -S . -B "$PROBE_DIR/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG -g1" \
            -DKOMAMIMIC_TEST_SCOPE=full -DPython3_EXECUTABLE=/usr/bin/python3.11 \
            -DQt6_DIR="$KOMA_PROBE_QT_DIR" \
            -DCMAKE_LIBRARY_PATH="${rx_libs//:/;}" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,-rpath-link,$KOMA_PROBE_JPEG_LIBDIR" \
            -DCMAKE_BUILD_RPATH="${rx_libs//:/;}" \
            -DICU_INCLUDE_DIR="$KOMA_PROBE_ICU_INCLUDE_DIR" \
            -DICU_UC_LIBRARY:FILEPATH="$KOMA_PROBE_ICU_LIBRARY" \
            -DICU_UC_LIBRARY_RELEASE:FILEPATH="$KOMA_PROBE_ICU_LIBRARY" \
            -Dpkgcfg_lib_POPPLER_cairo:FILEPATH="$KOMA_PROBE_CAIRO_LIBRARY" \
            -DLibArchive_INCLUDE_DIR="$PROBE_DIR/libarchive-prefix/include" \
            -DLibArchive_LIBRARY="$PROBE_DIR/libarchive-prefix/lib/libarchive.so"
      - name: Build
        run: |
          export TMPDIR="$PROBE_DIR/temp" XDG_CACHE_HOME="$PROBE_DIR/cache"
          cmake --build "$PROBE_DIR/build" --parallel 4 2>&1 | tee "$PROBE_DIR/build.log"
      - name: CLI smoke checks
        run: |
          exec > >(tee "$PROBE_DIR/cli.log") 2>&1
          export TMPDIR="$PROBE_DIR/temp" XDG_CACHE_HOME="$PROBE_DIR/cache"
          "$PROBE_DIR/build/komamimic" --version
          "$PROBE_DIR/build/komamimic" --formats
          ldd "$PROBE_DIR/build/komamimic"
          ldd "$PROBE_DIR/build/komamimic-script-worker"
      - name: Run full tests
        id: tests
        run: |
          export TMPDIR="$PROBE_DIR/temp" XDG_CACHE_HOME="$PROBE_DIR/cache"
          ctest --test-dir "$PROBE_DIR/build" --output-on-failure --parallel 2 \
            --no-tests=error --output-junit "$PROBE_DIR/ctest.xml" 2>&1 | tee "$PROBE_DIR/ctest.log"
      - name: Diagnose native fixture reader after test failure
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        timeout-minutes: 5
        run: |
          exec > >(tee "$PROBE_DIR/probe-debug.log") 2>&1
          export TMPDIR="$PROBE_DIR/temp" XDG_CACHE_HOME="$PROBE_DIR/cache"
          python3.11 tests/fixtures/generate_validation_samples.py --output "$PROBE_DIR/debug-fixtures"
          ldd "$PROBE_DIR/build/validation_probe"
          # Keep the original CTest failure. This run only collects a backtrace.
          gdb --batch --return-child-result \
            -ex 'set pagination off' \
            -ex 'set confirm off' \
            -ex 'set debuginfod enabled off' \
            -ex 'run' \
            -ex 'thread apply all bt' \
            -ex 'info sharedlibrary' \
            --args "$PROBE_DIR/build/validation_probe" "$PROBE_DIR/debug-fixtures"
      - name: Collect package download diagnostics
        if: always()
        run: |
          mkdir -p "$PROBE_DIR"
          for log in /var/log/komamimic-bootstrap.log /var/log/dnf.log /var/log/dnf.librepo.log /var/log/hawkey.log; do
            if [ -f "$log" ]; then
              cp "$log" "$PROBE_DIR/"
            fi
          done
      - name: Upload probe diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: diagnostics-rocky8-raven-x64
          path: |
            tmp/rocky8-probe/*.log
            tmp/rocky8-probe/*.txt
            tmp/rocky8-probe/*.repo
            tmp/rocky8-probe/ctest.xml
            tmp/rocky8-probe/build/CMakeCache.txt
            tmp/rocky8-probe/build/CMakeFiles/CMakeConfigureLog.yaml
            tmp/rocky8-probe/build/Testing/Temporary/*.log
            tmp/rocky8-probe/libarchive-build/CMakeCache.txt
            tmp/rocky8-probe/libarchive-build/CMakeFiles/CMakeConfigureLog.yaml
            tmp/rocky8-probe/libarchive-*.tar.gz
            tmp/rocky8-probe/qtimageformats-source.tar.gz
            tmp/rocky8-probe/qtiff-project/CMakeLists.txt
            tmp/rocky8-probe/qtiff-build/CMakeCache.txt
            tmp/rocky8-probe/qtiff-build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14
